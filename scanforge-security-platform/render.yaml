# Render Blueprint — ScanForge Platform
# https://render.com/docs/blueprint-spec

services:
  # ─── FastAPI Web API ───────────────────────────────────────────────
  - type: web
    name: scanforge-api
    runtime: python_3.12
    region: oregon
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: 2

      # Shared — from environment groups
      - fromGroup: shared-app
      - fromGroup: shared-db
      - fromGroup: auth
      - fromGroup: storage
      - fromGroup: queue

  # ─── Dedicated Organization Worker Host Notice (ADR-011) ──────────
  # Customer scan execution runs on dedicated per-organization Linux hosts
  # supervised via infra/worker/scanforge-worker.service and provisioned by
  # scripts/provision_worker_host.sh (with local git, local Docker daemon,
  # WORKER_CONCURRENCY=1, and controlled WORKER_WORKSPACE_ROOT).
  # Recurring scan scheduling (scanforge-scheduler) is deferred for initial beta (ADR-010).

  # ─── Weekly Maintenance & Stale Lease Recovery Cron ───────────────
  - type: cron
    name: scanforge-maintenance
    region: oregon
    plan: starter
    branch: main
    autoDeploy: true
    schedule: "0 5 * * 0"
    command: python -m app.worker.maintenance
    envVars:
      - key: APP_ENV
        value: production
      - fromGroup: shared-app
      - fromGroup: shared-db
      - fromGroup: storage
      - fromGroup: queue

  # Durable scan obligations retry independently of request and executor lifetimes.
  - type: cron
    name: scanforge-scan-dispatch
    region: oregon
    plan: starter
    branch: main
    autoDeploy: true
    schedule: "* * * * *"
    command: python -m app.dispatch_main
    envVars:
      - key: APP_ENV
        value: production
      - fromGroup: shared-app
      - fromGroup: shared-db
      - fromGroup: queue

# ─── Environment Groups ───────────────────────────────────────────
# Configure these in the Render Dashboard → Environment → Groups
#
# shared-app
#   DATABASE_URL=postgresql+asyncpg://...
#   APP_URL=https://api.scanforge.app
#   CORS_ORIGINS=["https://scanforge.app","https://*.scanforge.app"]
#
# shared-db
#   (merged into shared-app — DATABASE_URL is in shared-app)
#
# auth
#   NEON_AUTH_ISSUER=https://console.neon.tech/project/...
#   NEON_AUTH_AUDIENCE=scanforge-api
#   NEON_AUTH_JWKS_URL=https://console.neon.tech/project/.../.well-known/jwks.json
#
# Storage credentials are API-only. Dedicated workers receive presigned URLs
# and must not be provisioned with any R2 account credential.
#   R2_ENDPOINT=https://...r2.cloudflarestorage.com
#   R2_BUCKET=scanforge-artifacts
#   R2_ACCESS_KEY_ID=...
#   R2_SECRET_ACCESS_KEY=...
#   R2_PUBLIC_BASE_URL=https://cdn.scanforge.app
#
  # worker-beta
#   API_BASE_URL=https://api.scanforge.app
#   WORKER_CREDENTIAL=...             # one organization only
#   WORKER_ORGANIZATION_ID=...
#   WORKER_CONSUMER_NAME=...
#   SCANNER_IMAGE=registry.example/scanforge-scanners@sha256:<64-hex-digest>
#   Never include DATABASE_URL, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#   WORKER_CREDENTIAL_PEPPER, or SCHEDULER_API_KEY in this group.
#
# queue
