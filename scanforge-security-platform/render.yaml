# Validate this Blueprint before syncing. Dedicated scanner hosts use infra/worker.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: scanforge-api
    runtime: python
    rootDir: scanforge-security-platform/apps/api
    region: oregon
    plan: starter
    branch: main
    autoDeploy: false
    buildCommand: pip install -c constraints.txt --upgrade pip && pip install -c constraints.txt .
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: private-beta
      - key: AI_ENABLED
        value: "false"
      - fromGroup: shared-app
      - fromGroup: auth
      - fromGroup: storage
      - fromGroup: queue

  - type: cron
    name: scanforge-scheduler
    runtime: python
    rootDir: scanforge-security-platform/apps/worker
    region: oregon
    plan: starter
    branch: main
    autoDeploy: false
    schedule: "* * * * *"
    buildCommand: pip install -c constraints.txt --upgrade pip && pip install -c constraints.txt .
    startCommand: python -m app.worker.scheduler
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: private-beta
      - key: AI_ENABLED
        value: "false"
      - key: API_BASE_URL
        sync: false
      - key: SCHEDULER_API_KEY
        sync: false

# Provision these existing environment groups before syncing.
# shared-app contains DATABASE_URL, APP_URL, WEB_APP_URL, CORS_ORIGINS,
# WORKER_CREDENTIAL_PEPPER, and SCHEDULER_API_KEY.
# auth contains the required JWT issuer, audience, and verification keys.
# storage contains API-only object-storage account credentials.
# queue contains UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_REST_TOKEN.
# No managed Render worker executes repository scanners. Provision each
# organization host with infra/worker/docker-compose.beta.yml and a pinned image.
