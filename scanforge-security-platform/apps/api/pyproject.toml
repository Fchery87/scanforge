[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-security-platform-api"
version = "0.1.0"
description = "FastAPI backend for the repository security platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "gunicorn>=21.0.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.0",
  "alembic>=1.13.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "PyJWT[crypto]>=2.8.0",
  "email-validator>=2.0.0",
  "python-multipart>=0.0.9",
  "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.2.0",
  "mypy>=1.9.0",
  "httpx>=0.27.0",
  "pip-audit>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "F", "W", "I",
  "UP", "S", "B", "C4",
  "DTZ", "T10", "ISC",
  "PIE", "PT", "RET", "SIM",
  "TCH", "ARG", "PTH", "ERA", "PL",
  "NPY", "RUF",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S", "B", "PLR0913", "PLR2004"]
"app/api/**/*.py" = ["B008", "PLR0913", "ARG001", "ARG002"]
"app/middleware/*.py" = ["B008", "ARG001", "ARG002", "PLR0913", "PLR2004", "S110", "SIM108"]
"app/main.py" = ["ARG001"]
"app/api/v1/routes/scorecard.py" = ["PLR2004"]
"app/services/*.py" = ["PLR0913", "TC001"]
"app/db/models/*.py" = ["E501", "TC003", "PLC0415"]
"app/db/mixins.py" = ["E501"]
"app/schemas/findings.py" = ["S105"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
