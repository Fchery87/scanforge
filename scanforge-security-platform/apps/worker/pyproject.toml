[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-security-platform-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "boto3>=1.34.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.2.0",
  "pip-audit>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/scanners/*.py" = ["S603"]
"app/services/*.py" = ["S110", "E501"]
"app/worker/*.py" = ["S110", "E501"]
