name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            worker:
              - 'apps/worker/**'
            web:
              - 'apps/web/**'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app
      - name: Test (pytest)
        run: python -m pytest
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
      - name: Audit exception handlers (advisory)
        run: python scripts/check_exception_handlers.py
        env:
          DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost/dummy
      - name: Verify openapi.json is up-to-date
        run: python scripts/emit_openapi.py
        env:
          DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost/dummy
      - run: git diff --exit-code openapi.json
      - name: Audit dependencies (pip-audit)
        run: pip-audit --require-hashes --strict

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app
      - name: Test (pytest)
        run: python -m pytest
      - name: Audit dependencies (pip-audit)
        run: pip-audit --require-hashes --strict

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Test (vitest)
        run: npm test
      - name: Audit dependencies (npm audit)
        run: npm audit --audit-level=high
      - name: Verify api-types.ts is up-to-date
        run: npm run gen:types
      - run: git diff --exit-code lib/api-types.ts
      - name: Build
        run: npm run build

  sbom:
    needs: [api, worker, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json
          upload-artifact: true
