name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.filter.outputs.all }}
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            all:
              - '**'
            api:
              - 'scanforge-security-platform/apps/api/**'
              - 'scanforge-security-platform/packages/**'
              - 'scanforge-security-platform/Makefile'
              - 'scanforge-security-platform/render.yaml'
              - 'scanforge-security-platform/docker-compose.yml'
              - 'scanforge-security-platform/.github/**'
              - '.github/**'
              - 'scanforge-security-platform/infra/**'
              - 'scanforge-security-platform/scripts/**'
              - 'scanforge-security-platform/spec/**'
              - 'scanforge-security-platform/docs/adr/**'
            worker:
              - 'scanforge-security-platform/apps/worker/**'
              - 'scanforge-security-platform/packages/**'
              - 'scanforge-security-platform/Makefile'
              - 'scanforge-security-platform/render.yaml'
              - 'scanforge-security-platform/docker-compose.yml'
              - 'scanforge-security-platform/.github/**'
              - '.github/**'
              - 'scanforge-security-platform/infra/**'
              - 'scanforge-security-platform/scripts/**'
              - 'scanforge-security-platform/spec/**'
              - 'scanforge-security-platform/docs/adr/**'
            web:
              - 'scanforge-security-platform/apps/api/**'
              - 'scanforge-security-platform/apps/web/**'
              - 'scanforge-security-platform/packages/**'
              - 'scanforge-security-platform/Makefile'
              - 'scanforge-security-platform/render.yaml'
              - 'scanforge-security-platform/docker-compose.yml'
              - 'scanforge-security-platform/.github/**'
              - '.github/**'
              - 'scanforge-security-platform/infra/**'
              - 'scanforge-security-platform/scripts/**'
              - 'scanforge-security-platform/spec/**'
              - 'scanforge-security-platform/docs/adr/**'

  api:
    needs: changes
    if: needs.changes.outputs.all == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanforge-security-platform/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanforge-security-platform/apps/api/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app
      - name: Test (pytest)
        run: python -m pytest
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
      - name: Audit exception handlers (advisory)
        run: python scripts/check_exception_handlers.py
        env:
          DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost/dummy
      - name: Verify openapi.json is up-to-date
        run: python scripts/emit_openapi.py
        env:
          DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost/dummy
      - run: git diff --exit-code openapi.json
      - name: Test dependency audit inventory
        run: python -m unittest discover -s ../../scripts -p test_audit_python_dependencies.py
      - name: Audit dependencies (pip-audit)
        run: python ../../scripts/audit_python_dependencies.py

  worker:
    needs: changes
    if: needs.changes.outputs.all == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanforge-security-platform/apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanforge-security-platform/apps/worker/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app
      - name: Test (pytest)
        run: python -m pytest
      - name: Audit dependencies (pip-audit)
        run: python ../../scripts/audit_python_dependencies.py

  web:
    needs: changes
    if: needs.changes.outputs.all == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanforge-security-platform/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scanforge-security-platform/apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Test (node)
        run: npm run test:node
      - name: Test (vitest)
        run: npm run test:vitest
      - name: Audit dependencies (npm audit)
        run: npm audit --audit-level=high
      - name: Verify api-types.ts is up-to-date
        run: npm run gen:types
      - run: git diff --exit-code lib/api-types.ts
      - name: Build
        run: npm run build

  sbom:
    needs: [api, worker, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json
          upload-artifact: true

  required:
    if: always()
    needs: [changes, api, worker, web, sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required results
        env:
          CHANGES: ${{ needs.changes.result }}
          ALL_EXPECTED: ${{ needs.changes.outputs.all }}
          API: ${{ needs.api.result }}
          WORKER: ${{ needs.worker.result }}
          WEB: ${{ needs.web.result }}
          SBOM: ${{ needs.sbom.result }}
          API_EXPECTED: ${{ needs.changes.outputs.api }}
          WORKER_EXPECTED: ${{ needs.changes.outputs.worker }}
          WEB_EXPECTED: ${{ needs.changes.outputs.web }}
        run: |
          python - <<'PY'
          import os
          import sys

          errors = []
          main = os.environ["GITHUB_REF"] == "refs/heads/main"
          if os.environ["CHANGES"] != "success":
              errors.append("Change detection did not succeed")
          for name in ("API", "WORKER", "WEB"):
              expected = main or os.environ["ALL_EXPECTED"] == "true" or os.environ[name + "_EXPECTED"] == "true"
              allowed = {"success"} if expected else {"success", "skipped"}
              if os.environ[name] not in allowed:
                  errors.append(f"{name} result was {os.environ[name]}")
          allowed_sbom = {"success"} if main else {"success", "skipped"}
          if os.environ["SBOM"] not in allowed_sbom:
              errors.append(f"SBOM result was {os.environ['SBOM']}")
          print("\n".join(errors) if errors else "All required checks passed")
          sys.exit(bool(errors))
          PY
